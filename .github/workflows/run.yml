name: Bargh Manager

on:
  schedule:
    - cron: "*/2 * * * *"   # هر ۲ دقیقه (برای پاسخ‌گویی سریع‌تر به دکمه‌ها)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install telethon requests

      - name: Run main.py
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          MANAGER_BOT_TOKEN: ${{ secrets.MANAGER_BOT_TOKEN }}
          ADMIN_USER_ID: ${{ secrets.ADMIN_USER_ID }}
          ACTIVATION_CODE: ${{ secrets.ACTIVATION_CODE }}
        run: python main.py

      - name: Commit updated state
        run: |
          git config user.name "bargh-manager"
          git config user.email "bargh-manager@users.noreply.github.com"
          git add groups.json state.json settings.json pending.json history.json mgr_offset.json
          git diff --cached --quiet || git commit -m "update state"
          git push
