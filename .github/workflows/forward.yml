name: Forward outage messages

on:
  schedule:
    - cron: "*/5 * * * *"   # هر ۵ دقیقه
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  forward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install telethon

      - name: Run forwarder.py
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          ACTIVATION_CODE: ${{ secrets.ACTIVATION_CODE }}
        run: python forwarder.py

      - name: Commit updated state
        run: |
          git config user.name "outage-forwarder"
          git config user.email "outage-forwarder@users.noreply.github.com"
          git add groups.json state.json
          git diff --cached --quiet || git commit -m "update groups/state"
          git push
